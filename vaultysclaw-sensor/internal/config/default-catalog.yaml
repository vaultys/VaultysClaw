# Installed AI applications — desktop apps, CLIs, and AI-capable editors.
#
# This is the catalog that makes a laptop legible. It needs no network
# visibility at all, which matters because on macOS and Windows the OS hands us
# a bare IP for every connection and provider matching can fail outright.
#
# kind decides the weighting, and the distinction is the point of the design —
# AI *usage* is not an AI *agent*:
#   harness    an agentic coding/automation tool that reads and writes files and
#              runs commands on the user's behalf. AI *and* agent evidence.
#   assistant  a chat surface. AI only — the same line a browser tab sits on.
#   ide        an AI-capable editor. NO weight alone ("VS Code is installed" is
#              not AI usage); it scores only when the same process is also
#              talking to a provider, which is what a completion looks like.
#
# ORDER MATTERS: the first matching rule wins, and several of these live inside
# one another's install trees (Claude Code ships *inside* Claude.app's support
# directory; Codex inside ChatGPT.app's). Harness entries come first so a coding
# agent is never reported as a chat window. An operator's own catalog can get in
# front of these with `priority`.
aiApplications:
    # The bundled Claude Code binary lives under
    # ".../Claude/claude-code/<version>/claude.app/...", i.e. inside Claude.app's
    # own data — so this rule has to be matched before claude_desktop, not after.
    #
    # Deliberately no processNames entry: Claude Desktop's binary is also called
    # "claude", and a name match here would take precedence over claude_desktop
    # below and report every desktop chat window as a coding harness. The paths
    # and package names identify Claude Code unambiguously.
    - name: claude_code
      kind: harness
      executableSubstrings:
        - /claude-code/
        - /.claude/local/
      cmdlineSubstrings:
        - '@anthropic-ai/claude-code'
        - claude-code
        - claude-agent-sdk
    # ".codex/" is the CLI's own state directory; "openai.chatgpt-" is the VS
    # Code extension's install directory; "codex framework" is the helper bundle
    # ChatGPT.app runs Codex out of. Must precede openai_chatgpt_desktop, whose
    # bundle contains all three.
    - name: openai_codex
      kind: harness
      processNames:
        - codex
      executableSubstrings:
        - /.codex/
        - openai.chatgpt-
        - codex framework.framework
        - codex.app/
      cmdlineSubstrings:
        - '@openai/codex'
        - codex exec
        - codex-cli
    - name: github_copilot_cli
      kind: harness
      cmdlineSubstrings:
        - '@github/copilot'
        - copilot-cli
        - gh copilot
    - name: gemini_cli
      kind: harness
      processNames:
        - gemini
      cmdlineSubstrings:
        - '@google/gemini-cli'
        - gemini-cli
    - name: qwen_code
      kind: harness
      cmdlineSubstrings:
        - '@qwen-code/'
        - qwen-code
    - name: opencode
      kind: harness
      processNames:
        - opencode
      executableSubstrings:
        - opencode.app/
        - /opencode/
      cmdlineSubstrings:
        - opencode-ai
        - opencode run
    - name: aider
      kind: harness
      processNames:
        - aider
      cmdlineSubstrings:
        - aider-chat
        - aider.main
        - /aider
    - name: cline
      kind: harness
      cmdlineSubstrings:
        - saoudrizwan.claude-dev
        - rooveterinaryinc.roo-cline
        - kilocode.kilo-code
        - roo-cline
        - kilo-code
    - name: goose
      kind: harness
      processNames:
        - goose
        - goosed
      executableSubstrings:
        - goose.app/
      cmdlineSubstrings:
        - goose session
        - block/goose
        - goosed
    - name: amp_code
      kind: harness
      cmdlineSubstrings:
        - '@sourcegraph/amp'
        - sourcegraph.amp
    - name: factory_droid
      kind: harness
      cmdlineSubstrings:
        - '@factory-ai/'
        - factory-cli
    - name: openhands
      kind: harness
      cmdlineSubstrings:
        - openhands
        - opendevin
    - name: continue_dev
      kind: harness
      cmdlineSubstrings:
        - '@continuedev/'
        - continue.continue
        - continuedev
    - name: cursor
      kind: harness
      executableSubstrings:
        - cursor.app/
        - /cursor/resources/app
        - cursor helper
      cmdlineSubstrings:
        - cursor-agent
    - name: windsurf
      kind: harness
      executableSubstrings:
        - windsurf.app/
        - /windsurf/resources/app
      cmdlineSubstrings:
        - windsurf-server
        - codeium-language-server
    # --- assistants: a chat surface. AI usage, never agent evidence. ---
    - name: claude_desktop
      kind: assistant
      executableSubstrings:
        - claude.app/
      cmdlineSubstrings:
        - claude_desktop
    - name: openai_chatgpt_desktop
      kind: assistant
      processNames:
        - chatgpt
      executableSubstrings:
        - chatgpt.app/
    - name: moonshot_kimi
      kind: assistant
      processNames:
        - kimi
        - kimi helper
      executableSubstrings:
        - kimi.app/
        - kimi for desktop.app/
        - kimi-desktop
      cmdlineSubstrings:
        - kimi-cli
        - kimi.moonshot
    - name: deepseek_desktop
      kind: assistant
      processNames:
        - deepseek
      executableSubstrings:
        - deepseek.app/
    - name: grok_desktop
      kind: assistant
      executableSubstrings:
        - grok.app/
    - name: perplexity_desktop
      kind: assistant
      executableSubstrings:
        - perplexity.app/
    - name: microsoft_copilot
      kind: assistant
      executableSubstrings:
        - copilot.app/
        - microsoft copilot.app/
    - name: chatbox
      kind: assistant
      executableSubstrings:
        - chatbox.app/
        - xyz.chatboxapp
    - name: msty
      kind: assistant
      executableSubstrings:
        - msty.app/
    - name: cherry_studio
      kind: assistant
      executableSubstrings:
        - cherry studio.app/
        - cherrystudio
    - name: anythingllm
      kind: assistant
      executableSubstrings:
        - anythingllm.app/
      cmdlineSubstrings:
        - anythingllm
    - name: open_webui
      kind: assistant
      cmdlineSubstrings:
        - open-webui
        - open_webui
        - librechat
    # --- AI-capable editors. No weight alone; see the note above. ---
    - name: vscode
      kind: ide
      executableSubstrings:
        - visual studio code.app/
        - code - insiders.app/
        - /vscode-server/
        - vscodium.app/
    - name: zed
      kind: ide
      processNames:
        - zed
      executableSubstrings:
        - zed.app/
        - zed preview.app/
    - name: jetbrains
      kind: ide
      executableSubstrings:
        - /jetbrains/
        - jetbrains toolbox.app/
    - name: xcode
      kind: ide
      executableSubstrings:
        - xcode.app/contents/macos/xcode

# Locally-served models.
#
# A listening port alone is weak evidence (anything can bind a port); a process
# name or command line is much stronger. vllm/llama_cpp/localai deliberately
# have no ports entry: 8000 and 8080 are extremely common generic dev-server
# ports and would weak-match constantly on unrelated processes. "server" is
# likewise deliberately absent from llama_cpp's process names — a common generic
# binary name that would otherwise produce a *strong* false match.
localRuntimes:
    - name: ollama
      processNames:
        - ollama
        - ollama-runner
      cmdlineSubstrings:
        - ollama serve
        - ollama run
        - ollama.app/
      ports:
        - 11434
    - name: lm_studio
      processNames:
        - lms
        - lm-studio
        - lm studio
      cmdlineSubstrings:
        - lm-studio
        - lms server
        - lm studio.app/
      ports:
        - 1234
    - name: vllm
      processNames:
        - vllm
      cmdlineSubstrings:
        - vllm.entrypoints
        - vllm serve
    - name: llama_cpp
      processNames:
        - llama-server
        - llama-cli
        - llamafile
      cmdlineSubstrings:
        - llama.cpp
        - llama-server
        - llamafile
    - name: localai
      processNames:
        - local-ai
        - localai
      cmdlineSubstrings:
        - localai
    - name: jan
      processNames:
        - cortex
        - cortex-server
      cmdlineSubstrings:
        - jan.app/
        - cortex-server
      ports:
        - 1337
    - name: gpt4all
      processNames:
        - gpt4all
        - chat
      cmdlineSubstrings:
        - gpt4all
    - name: koboldcpp
      processNames:
        - koboldcpp
      cmdlineSubstrings:
        - koboldcpp
      ports:
        - 5001
    - name: text_generation_webui
      cmdlineSubstrings:
        - text-generation-webui
        - server.py --model
    - name: tgi
      cmdlineSubstrings:
        - text-generation-launcher
        - text-generation-inference
    - name: sglang
      cmdlineSubstrings:
        - sglang.launch_server
        - sglang serve
    - name: lmdeploy
      cmdlineSubstrings:
        - lmdeploy serve
    - name: xinference
      cmdlineSubstrings:
        - xinference
    - name: mlx_lm
      cmdlineSubstrings:
        - mlx_lm.server
        - mlx_lm.generate
        - mlx-lm
    - name: ramalama
      processNames:
        - ramalama
      cmdlineSubstrings:
        - ramalama

# MCP server command lines, matched on the process or on one of its children.
# A matched *child* is much stronger agent evidence than a self-match: a bare
# `npx @modelcontextprotocol/server-filesystem` could be someone poking at MCP
# by hand, but a long-running parent that spawns one is operating as an agent.
mcpServers:
    - name: mcp_generic
      cmdlineSubstrings:
        - '@modelcontextprotocol/'
        - mcp-server-
        - mcp_server_
        - -mcp-server
        - modelcontextprotocol
        - mcp-remote
        - fastmcp
        - mcp.server
        - --mcp-config
        - mcp-proxy
    - name: mcp_filesystem
      cmdlineSubstrings:
        - server-filesystem
    - name: mcp_github
      cmdlineSubstrings:
        - server-github
        - github-mcp
    - name: mcp_postgres
      cmdlineSubstrings:
        - server-postgres
        - postgres-mcp
    - name: mcp_browser
      cmdlineSubstrings:
        - playwright-mcp
        - puppeteer-mcp
        - server-puppeteer
        - chrome-devtools-mcp
        - browsermcp
    - name: mcp_memory
      cmdlineSubstrings:
        - server-memory
        - server-sequential-thinking
    - name: mcp_slack
      cmdlineSubstrings:
        - server-slack
        - slack-mcp
    - name: claude_desktop
      cmdlineSubstrings:
        - Claude.app
        - claude_desktop

# Agent libraries appearing in a command line. A naming-convention signal, not
