# vaultysclaw-sensor — built-in detection catalog
#
# THIS FILE IS THE DEFAULT RULE SET. It is compiled into the binary with
# //go:embed (see catalog_default.go) and parsed at startup, so editing it is a
# change to the shipped defaults, reviewed as a normal diff rather than buried
# in a Go composite literal. It is validated by the same Catalog.Validate the
# operator-supplied file goes through, and a malformed edit fails the tests.
#
# Do NOT edit this file to add a rule for your own deployment. Put it in your
# own catalog (default ~/.vaultysclaw-sensor/catalog.yaml), which is merged
# additively over this one and can be reloaded without a restart. See
# docs/DETECTION_CATALOG.md.
#
# Matching, for every catalog below:
#   processNames          exact, case-insensitive match on the basename
#   executableSubstrings  case-insensitive substring of the full executable path
#   cmdlineSubstrings     case-insensitive substring of the full command line
#   hosts                 exact name; a leading "." is a suffix match; a bare
#                         fragment with no dot is a substring match
#
# Every matcher must be at least 3 characters: a shorter fragment matches most
# of the process table, and that flood is far harder to diagnose than an error.

providers:
    - name: openai
      hosts:
        - api.openai.com
        - openai.com
        - chatgpt.com
        - chat.openai.com
        - api.chatgpt.com
    - name: anthropic
      hosts:
        - api.anthropic.com
        - claude.ai
        - anthropic.com
    - name: azure_openai
      hosts:
        - .openai.azure.com
        - .cognitiveservices.azure.com
        - .services.ai.azure.com
    # cloudcode-pa is the endpoint the Gemini CLI / Code Assist actually talks
    # to — distinct from the public Gemini API host, and the only one that
    # appears when a developer uses the CLI rather than the web UI.
    - name: google_gemini
      hosts:
        - generativelanguage.googleapis.com
        - gemini.google.com
        - aiplatform.googleapis.com
        - cloudcode-pa.googleapis.com
    # Deliberately not ".amazonaws.com" (bare) — that suffix matches almost any
    # AWS-hosted service (S3, CloudFront origins, ...), not just Bedrock, and
    # would false-positive constantly.
    - name: aws_bedrock
      hosts:
        - bedrock-runtime
        - bedrock-agent
    - name: mistral
