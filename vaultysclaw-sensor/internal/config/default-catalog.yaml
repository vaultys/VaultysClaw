    # Deliberately not the bare substring "vaultysclaw" — that matches any shell
    # command merely mentioning a path containing the repo/org name (e.g.
    # `cd .../VaultysClaw`), not an actual agent-controller invocation.
    - name: vaultysclaw_agent
      cmdlineSubstrings:
        - agent-controller

# Browsers. AI-site connections from these contribute to AI confidence but never
# to agent confidence: a tab open to chatgpt.com is AI usage, not agentic
# behaviour, however long it has been open.
browserProcessNames:
    - chrome
    - google chrome
    - chromium
    - firefox
    - safari
    - msedge
    - microsoft edge
    - opera
    - brave
    - brave browser
    - arc
    - vivaldi

# An application's *support* processes — crash reporters, auto-updaters,
# installers. These live inside a matched app's bundle and so match its
# executable-path rules, but they are never the AI workload: reporting Codex's
# crashpad handler as an agent is noise that buries the process actually talking
# to a model. Matched as a substring of both the basename and the full path.
#
# Suppresses only the application match. A support process that somehow does
# talk to a provider still scores on that evidence alone.
supportProcessSubstrings:
    - crashpad
    - crash_handler
    - crashhandler
    - crashreporter
    - crash reporter
    - updater
    - autoupdate
    - auto-update
    - sparkle
    - installer
    - uninstall
    - diagnostics
    - problemreporter
