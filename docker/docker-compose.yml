# VaultysClaw — the deployed stack.
#
# This is what .github/workflows/deploy.yml builds and starts on the server
# (`cd docker && docker compose up --build -d`), and what
# .github/workflows/docker-build.yml builds on every PR without starting anything.
#
# Five long-running services (plus one one-shot), which is the whole system as described in the root CLAUDE.md:
#
#   controlplane        Next.js admin console + WebSocket server (one process, two ports)
#   webhook-dispatcher  BullMQ consumer: signs webhooks, fans out to Apprise
#   postgres            the certificate ledger
#   postgres-roles      one-shot: the application's non-superuser Postgres role (then exits)
#   redis               the BullMQ "webhooks" queue
#   apprise             Notification Channels
#
# Deliberately NOT here:
#   - LiteLLM. The Model Registry is configured in the console (Integrations → Models) and stores
#     its master key encrypted; LITELLM_BASE_URL is only a deployment-time fallback. Point it at an
#     external proxy if you want one — docker/Dockerfile.litellm was removed in 30bf747.
#   - MinIO, Docling, Prisma Studio, the notifier. All belonged to the pre-rebuild architecture.
#
# Quick start (from repo root):
#   cp .env.compose.example .env.compose     # then fill the four REQUIRED secrets
#   docker compose -f docker/docker-compose.yml --env-file .env.compose up --build -d
# or simply ./quick-start.sh, which generates them for a local stack.
#
# Secrets have NO defaults: NEXTAUTH_SECRET, PG_PASSWORD, PG_APP_PASSWORD and REDIS_PASSWORD use
# ${VAR:?…}, so a missing or incomplete docker/.env makes `docker compose up` fail instead of
# starting with a value published in this repository. The control plane additionally refuses to
# start in production with a short or known NEXTAUTH_SECRET (lib/startup-secrets.ts).
# Use hex/base64url values (openssl rand -hex 32): PG_APP_PASSWORD and REDIS_PASSWORD are embedded
# in connection URLs.
#
# Postgres and Redis host ports are bound to 127.0.0.1 only. Docker's published ports bypass the
# host firewall (ufw), so a bare "5432:5432" is reachable from the internet whatever ufw says.
#
# Not to be confused with the two dev stacks alongside it, which start backing services ONLY and
# use different ports so all three can coexist:
#   docker-compose.controlplane.yml   dev infra for `pnpm controlplane:dev`   (5433/6381/8000)
#   docker-compose.simulator.yml     the fleet simulator's own database       (5434)
#
# No `name:` here, unlike those two — on purpose. The project name stays the default (the
# directory, i.e. "docker"), which is what the already-deployed stack uses, so `pgdata` keeps
# resolving to the existing `docker_pgdata` volume. Naming the project would silently point the
# deploy at fresh, empty volumes: a new ledger and a lost database.

services:
  # ── PostgreSQL — the certificate ledger ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vaultys
      # The bootstrap SUPERUSER. Used only by the postgres-roles service and the healthcheck — the
      # application connects as the non-superuser PG_APP_USER below.
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required — see .env.compose.example}
      POSTGRES_DB: vaultysclaw
    ports:
      # Loopback only: for psql / Prisma Studio from the host or over an SSH tunnel.
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces TCP (not the unix socket), so this only reports healthy once a real
      # network connection works — which is what the other containers need.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U vaultys -d vaultysclaw"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    restart: unless-stopped

  # ── Postgres roles — one-shot, before anything connects ──────────────────────
  # Creates/updates the application's non-superuser role and hands it ownership of the database
  # and of every existing object, so migrations keep working on volumes created before this role
  # existed. See postgres-app-role.sh. Re-runs on every `up`; idempotent.
  postgres-roles:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: vaultys
      PGPASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required — see .env.compose.example}
      PG_DB: vaultysclaw
      PG_APP_USER: vaultysclaw_app
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:?PG_APP_PASSWORD is required — see .env.compose.example}
    volumes:
      - ./postgres-app-role.sh:/postgres-app-role.sh:ro
    entrypoint: ["sh", "/postgres-app-role.sh"]
    restart: "no"

  # ── Redis — the BullMQ webhook queue ──────────────────────────────────────────
  # Password-protected: anyone who can write to this queue gets the dispatcher to sign arbitrary
  # payloads with the real webhook secrets. Host port defaults to 6380 to avoid clashing with a
  # local Redis on 6379, loopback only; in-network clients always reach it as redis:6379.
  redis:
    image: redis:7-alpine
    # $$ = a literal $: the container's shell expands it from REDIS_PASSWORD below, so the value
    # is written once (in the env file) rather than interpolated into this command by compose.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required — see .env.compose.example}
      # Read by redis-cli, for the healthcheck and for `docker compose exec redis redis-cli`.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required — see .env.compose.example}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Apprise — backs Notification Channels ─────────────────────────────────────
  # No host port: it is reachable only from the control plane and the dispatcher on the compose
  # network. Unsetting APPRISE_API_URL on those services turns Notification Channels off entirely
  # without affecting webhook delivery.
  apprise:
    image: caronc/apprise:latest
    volumes:
      - appriseconfig:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ── Control plane — HTTP 3000, WebSocket 8080 ─────────────────────────────────
  # Runs `prisma migrate deploy` before the server starts (see the Dockerfile's CMD), so the
  # schema is applied on every deploy.
  controlplane:
    build:
      context: ..
      dockerfile: docker/Dockerfile.controlplane
      # NEXT_PUBLIC_* must be passed HERE, not in `environment:` — Next.js inlines them into the
      # client bundle at build time, so a value set at runtime is simply never read. Changing one
      # means rebuilding the image (`docker compose up --build -d controlplane`).
      args:
        NEXT_PUBLIC_WALLET_URL: ${NEXT_PUBLIC_WALLET_URL:-https://wallet.vaultys.net}
        NEXT_PUBLIC_MAP_TILE_URL: ${NEXT_PUBLIC_MAP_TILE_URL:-}
        NEXT_PUBLIC_ALLOW_DEV_LOGIN: ${NEXT_PUBLIC_ALLOW_DEV_LOGIN:-}
    ports:
      - "${CONTROLPLANE_PORT:-3000}:3000"
      - "${CONTROLPLANE_WS_PORT:-8080}:8080"
    depends_on:
      postgres-roles:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      apprise:
        condition: service_started
    environment:
      # The non-superuser role from postgres-roles — never the bootstrap superuser.
      DATABASE_URL: postgresql://vaultysclaw_app:${PG_APP_PASSWORD:?PG_APP_PASSWORD is required}@postgres:5432/vaultysclaw
      # Not overridable on purpose: the only Redis here is the password-protected one above, and an
      # inherited REDIS_URL without the password would fail every enqueue with NOAUTH.
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      APPRISE_API_URL: ${APPRISE_API_URL:-http://apprise:8000}
      # Required, and checked again at startup: with a known value anyone can forge an admin
      # session JWT.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required — openssl rand -hex 32}
      # Browser-facing base URL; also what adminUrl deep links are built from (APP_URL wins).
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      APP_URL: ${APP_URL:-}
      # server.ts reads these two — not PORT/WS_PORT.
      CONTROLPLANE_PORT: "3000"
      CONTROLPLANE_WS_PORT: "8080"
      NODE_ENV: production
      # Deployment-time fallback only; the Setting rows an admin edits under Integrations → Models
      # win over both of these.
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
    healthcheck:
      # /login is the one page that renders without a session; a 200 here means Next.js is serving.
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/login >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  # ── Webhook dispatcher ────────────────────────────────────────────────────────
  # BULLMQ_PREFIX must match the control plane's producer prefix or jobs are never seen. It must
  # also point at the SAME Postgres the control plane writes to — same URL, one source of truth.
  webhook-dispatcher:
    build:
      context: ..
      dockerfile: docker/Dockerfile.webhook-dispatcher
    depends_on:
      postgres-roles:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      controlplane:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://vaultysclaw_app:${PG_APP_PASSWORD:?PG_APP_PASSWORD is required}@postgres:5432/vaultysclaw
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      APPRISE_API_URL: ${APPRISE_API_URL:-http://apprise:8000}
      BULLMQ_PREFIX: ${BULLMQ_PREFIX:-vaultysclaw-controlplane}
      WEBHOOK_TIMEOUT_MS: ${WEBHOOK_TIMEOUT_MS:-10000}
      NODE_ENV: production
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  appriseconfig:
