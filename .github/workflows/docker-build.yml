name: Docker Build

# Builds the deployment images, then verifies the isolated local setup starts.
# Guards against merging PRs that would break `docker compose up --build`
# on the deploy server (e.g. a new workspace package the Dockerfiles don't copy —
# each one lists them by hand, so packages/ and the two Dockerfiles drift silently).
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build images and verify local setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds every service with a `build:` section in the deploy compose file
      # (controlplane, webhook-dispatcher) exactly as the deploy does, but stops
      # at build — nothing is started.
      - name: Build compose images
        working-directory: docker
        run: docker compose build

      - name: Test local setup launcher
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Start isolated local stack and wait for readiness
        run: ./quick-start.sh

      - name: Check public login
        run: curl --fail --silent --show-error http://localhost:3010/login --output /dev/null

      - name: Service diagnostics on failure
        if: failure()
        run: |
          if [ -f docker/quickstart.env ]; then
            docker compose --project-name vaultysclaw-quickstart --env-file docker/quickstart.env -f docker/docker-compose.yml -f docker/docker-compose.quickstart.yml ps -a
            docker compose --project-name vaultysclaw-quickstart --env-file docker/quickstart.env -f docker/docker-compose.yml -f docker/docker-compose.quickstart.yml logs --tail 100
          fi

      - name: Stop isolated local stack
        if: always()
        run: |
          if [ -f docker/quickstart.env ]; then
            ./quick-start.sh --down
          fi
