        - semantic_kernel
        - semantic-kernel
    - name: pydantic_ai
      cmdlineSubstrings:
        - pydantic_ai
        - pydantic-ai
    - name: smolagents
      cmdlineSubstrings:
        - smolagents
    - name: agno
